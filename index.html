<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typewriter Mode — the sound of writing</title>
<meta name="description" content="A writing surface with a typewriter mode: synthesised key clacks, a margin bell, a carriage return, and a caret that stays where your eye does. No samples, no dependencies.">
<meta name="theme-color" content="#12100c">
<meta property="og:title" content="Typewriter Mode — the sound of writing">
<meta property="og:description" content="Nostalgia as a feedback loop: every keystroke synthesised in the browser, a bell at the margin, a carriage return at the line.">
<meta property="og:type" content="website">
<link rel="canonical" href="https://vishnuvsdevtech.github.io/typewriter-mode/">
<link rel="stylesheet" href="assets/app.css">
</head>
<body class="">

<header class="bar">
  <div class="brand"><i></i><span>TYPEWRITER MODE</span></div>
  <div class="right">
    <span class="hint-hide" id="modeHint">click, then write</span>
    <button class="toggle" id="soundBtn" aria-pressed="true" title="Toggle sound">sound on</button>
    <button class="toggle" id="modeBtn" aria-pressed="true" title="Toggle typewriter / modern">typewriter</button>
  </div>
</header>

<main class="desk">
  <div class="sheet" id="sheet">
    <textarea id="editor" class="editor" spellcheck="false"
      placeholder="Begin anywhere. The first line is the hardest; after that the machine does the work."></textarea>
  </div>
</main>

<footer class="foot">
  <span><b id="words">0</b> words · <b id="chars">0</b> chars</span>
  <span class="hint" id="hint">autosaved locally · ⌘/Ctrl+S to file</span>
</footer>

<div class="note" id="note"></div>

<script src="assets/audio.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
